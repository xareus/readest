# Personal Android APK build (arm64 only, manual trigger).
#
# Mirrors the Android leg of release.yml (JDK 17 / NDK / keystore injection),
# but skips the release plumbing: no GitHub Release, no updater signature,
# no other platforms. The APK is uploaded as a workflow artifact.
#
# The Android project under src-tauri/gen/android is regenerated by
# `tauri android init` and the tracked customisations (build.gradle.kts with
# applicationId com.onion.readest, AndroidManifest.xml, MainActivity.kt) are
# restored by `git checkout .` afterwards, so this workflow inherits whatever
# is committed on the branch it runs from.
name: Android APK (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Backstop above the 90 min build step.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package no longer exists in the SDK repository
          # and makes sdkmanager fail.
          packages: 'platform-tools'

      - name: install NDK
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: build APK (arm64)
        shell: bash
        timeout-minutes: 90
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          # Restore the tracked customisations overwritten by `android init`
          # (build.gradle.kts applicationId, AndroidManifest.xml, MainActivity.kt).
          git checkout .

          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            pushd src-tauri/gen/android
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > keystore.properties
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> keystore.properties
            base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/keystore.jks" >> keystore.properties
            popd
            pnpm tauri android build -t aarch64
          else
            # No signing secrets configured: fall back to a debug-signed APK so
            # the artifact is installable. Add ANDROID_KEY_* secrets for a
            # properly signed release build.
            echo "::warning::ANDROID_KEY_BASE64 is not set; building a debug-signed APK."
            pnpm tauri android build -t aarch64 --debug
          fi

          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Built APK: $apk"
          cp "$apk" "ORead-${GITHUB_RUN_NUMBER}-arm64.apk"

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORead-arm64-apk
          path: apps/readest-app/ORead-*-arm64.apk
          if-no-files-found: error
          retention-days: 30
